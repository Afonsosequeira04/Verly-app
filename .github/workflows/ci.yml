name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile backend
        env:
          FLASK_ENV: testing
          AUTO_MIGRATE_ON_STARTUP: 'false'
        run: python -m compileall app config.py run.py

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: verly-mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: verly-mobile/package-lock.json
      - name: Install mobile dependencies
        run: npm ci
      - name: Check Expo project
        run: |
          set +e
          output="$(npx expo-doctor --verbose 2>&1)"
          status=$?
          set -e
          echo "$output"

          if [ "$status" -ne 0 ]; then
            if echo "$output" | grep -q "1 checks failed" && echo "$output" | grep -q "Check for app config fields that may not be synced in a non-CNG project"; then
              echo "::warning::Expo Doctor only reported the expected non-CNG native project warning."
            else
              exit "$status"
            fi
          fi
